# Local development only: Postgres on localhost:5432 (npm run db:up).
# Production uses docker-compose.prod.yml.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: candly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: candly_ship
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U candly -d candly_ship"]
      interval: 5s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"

volumes:
  pgdata:
