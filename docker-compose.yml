services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: candly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: candly_ship
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U candly -d candly_ship"]
      interval: 5s
      retries: 10
    # Exposed on localhost only (for `npm run dev` / backups). Remove in production if not needed.
    ports:
      - "127.0.0.1:5432:5432"

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://candly:${POSTGRES_PASSWORD}@db:5432/candly_ship
    depends_on:
      db:
        condition: service_healthy
    profiles: ["prod"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [app]
    profiles: ["prod"]

volumes:
  pgdata:
  caddy_data:
