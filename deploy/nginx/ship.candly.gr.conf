# /etc/nginx/sites-available/ship.candly.gr
# HTTP only at first — `certbot --nginx -d ship.candly.gr` then adds HTTPS + redirect automatically.

server {
    listen 80;
    listen [::]:80;
    server_name ship.candly.gr;

    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # bulk voucher creation / label merging can take a while
    }
}
